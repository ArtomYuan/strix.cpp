name: docs

on:
  push:
    branches: [master]
    paths:
      - "**.md"
      - ".github/md-link-allowlist.txt"
      - "scripts/check-md-links.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - ".github/md-link-allowlist.txt"
      - "scripts/check-md-links.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links
        run: python3 scripts/check-md-links.py

name: build

# Minimal compile check. This fork targets gfx1151/ROCm, which GitHub-hosted
# runners do not have; the CPU backend still exercises the shared code paths
# (ggml-base, rocmfp4/rocmfpx reference implementations, server, CLI).
# The upstream workflow set is intentionally not restored.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Configure (CPU preset)
        run: cmake --preset cpu-check

      - name: Build (same preset as local)
        run: cmake --build --preset cpu-check

      - name: Check that the build reports the strix.cpp version
        run: |
          build/cpu-check/bin/llama-cli --version 2>&1 | tee /tmp/version.out
          grep -q "strix.cpp:" /tmp/version.out
          grep -q "upstream base" /tmp/version.out
